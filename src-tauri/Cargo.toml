[package]
name = "musahih-pro"
version = "0.1.0"
edition = "2021"
description = "Musahih Pro desktop correction engine"
license = "Proprietary"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
strsim = "0.11"
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "detector_bench"
harness = false
